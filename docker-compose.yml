name: tarea2
services:
  db:
    image: pgrouting/pgrouting:16-3.5-3.8.0
    container_name: tarea2-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tarea2
    ports:
      - "5434:5432"
    volumes:
      - tarea2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tarea2"]
      interval: 5s
      retries: 20
volumes:
  tarea2_pgdata:
